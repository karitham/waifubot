# One-command formatting for the whole repo: `treefmt` from the devShell.
# Formatter binaries are provided by the flake devShell / formatter output.

[global]
excludes = [
  "result",
  "flake.lock",
  "frontend/node_modules/**",
  "frontend/dist/**",
  "frontend/package-lock.json",
  "frontend/src/api/generated.ts",
  "backend/anilist/schema.graphql",
]

[formatter.go]
command = "gofumpt"
options = ["-w"]
includes = ["*.go"]
excludes = [
  "backend/anilist/*.gen.go",        # genqlient
  "backend/rest/api/*.go",           # ogen
  "backend/storage/*.sql.go",        # sqlc
  "backend/storage/db.go",           # sqlc
  "backend/storage/models.go",       # sqlc
  "backend/storage/querier.go",      # sqlc
  "backend/**/mocks/*.go",           # mockgen
]

[formatter.md]
command = "oxfmt"
options = ["format", "--write"]
includes = ["*.md"]

[formatter.sql]
command = "sql-formatter"
# treefmt passes the file positionally and expects it rewritten in place; the
# wrapper in flake.nix adapts the CLI (see the comment there).
options = ["-l", "postgresql", "-c", '{"dataTypeCase":"upper","expressionWidth":80,"functionCase":"upper","identifierCase":"lower","keywordCase":"upper","language":"postgresql","tabWidth":2}']
# The CLI formats a single file per invocation.
no-positional-arg-support = true
includes = ["*.sql"]
# schema.sql is a pg_dump snapshot, not source: formatting it changes the case
# of types and keywords and breaks storage/schema_test.go's token comparison.
excludes = ["backend/storage/schema.sql"]

[formatter.yaml]
command = "oxfmt"
options = ["format", "--write"]
includes = ["*.yaml", "*.yml"]

[formatter.frontend]
command = "oxfmt"
options = ["format", "--write"]
includes = ["*.ts", "*.tsx", "*.mts", "*.js", "*.jsx", "*.json", "*.css"]

[formatter.nix]
command = "nixfmt"
includes = ["*.nix"]
