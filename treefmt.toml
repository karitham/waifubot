# One-command formatting for the whole repo: `treefmt` from the devShell.
# Formatter binaries are provided by the flake devShell / formatter output.

[global]
excludes = [
  "result",
  "flake.lock",
  "frontend/node_modules/**",
  "frontend/dist/**",
  "frontend/package-lock.json",
  "frontend/src/api/generated.ts",
  "backend/anilist/schema.graphql",
]

[formatter.go]
command = "gofumpt"
options = ["-w"]
includes = ["*.go"]
excludes = [
  "backend/anilist/*.gen.go",        # genqlient
  "backend/rest/api/*.go",           # ogen
  "backend/storage/*.sql.go",        # sqlc
  "backend/storage/db.go",           # sqlc
  "backend/storage/models.go",       # sqlc
  "backend/storage/querier.go",      # sqlc
  "backend/**/mocks/*.go",           # mockgen
]

[formatter.md]
command = "oxfmt"
includes = ["*.md"]

[formatter.frontend]
command = "oxfmt"
options = ["format", "--write"]
includes = ["*.ts", "*.tsx", "*.mts", "*.js", "*.jsx", "*.json", "*.css"]

[formatter.nix]
command = "nixfmt"
includes = ["*.nix"]
