version: "2"

sql:
  - queries: "./queries"
    schema: "./schema.sql"
    engine: "postgresql"
    gen:
      go:
        out: "."
        package: "storage"
        emit_interface: true
        emit_prepared_queries: true
        sql_package: pgx/v5
        sql_driver: github.com/jackc/pgx/v5

overrides:
  go:
    overrides:
      - column: users.user_id
        go_type: uint64
      - column: guild_members.guild_id
        go_type: uint64
      - column: guild_indexing_jobs.guild_id
        go_type: uint64
      - column: guild_members.user_id
        go_type: uint64
      - column: collection.user_id
        go_type: uint64
      - column: collection.character_id
        go_type: int64
      - column: channel_interactions.channel_id
        go_type: uint64
      - column: channel_drops.channel_id
        go_type: uint64
      - column: character_wishlist.user_id
        go_type: uint64
      - column: character_wishlist.character_id
        go_type: int64
